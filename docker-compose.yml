services:
  postgres:
    image: postgres:18.7-bookworm
    container_name: pjoin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pjoin
      POSTGRES_PASSWORD: pjoin_local_dev
      POSTGRES_DB: pjoin
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pjoin-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pjoin -d pjoin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pjoin-postgres-data:
